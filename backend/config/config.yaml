# 数据库配置
database:
  host: 127.0.0.1
  port: 5432
  name: pdf_rag
  user: postgres
  password: postgres
  pool_size: 10
  max_overflow: 20

# Ollama配置
ollama:
  host: 192.168.31.80
  port: 11434
  model: qwen3:14b
  timeout: 600
  temperature: 0.7
  max_tokens: 8192

# 嵌入模型配置
embedding:
  model: "bge-m3:latest"
  batch_size: 64
  max_length: 1024
  api_url: "http://127.0.0.1:11434"
  use_remote_api: true

# 文档处理配置 - 父子分片优化参数
document:
  chunk_size: 300                    # 子分片大小，提高检索精度
  chunk_overlap: 60                  # 重叠大小，保持20%重叠比例
  parent_chunk_size: 800             # 父分片大小，保持语义完整性
  max_chunks_per_document: 200
  use_hierarchical_chunking: true    # 启用父子分片

# 向量检索配置
retrieval:
  top_k: 12
  similarity_threshold: 0.5
  rerank: true
  rerank_top_k: 8

# 日志配置
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/pdf_rag.log"
  enable_llm_verbose: true 
  llm_max_log_chars: 4000
  llm_redact_keys: ["embedding", "embeddings", "token_ids", "vectors", "kv"] 